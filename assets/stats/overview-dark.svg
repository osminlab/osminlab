<svg xmlns="http://www.w3.org/2000/svg" width="840" height="176" viewBox="0 0 840 176" role="img" aria-label="GitHub activity">
<title>GitHub activity</title>

<style>
  text { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; fill: #f0f6fc; }
  .title { font-size: 16px; font-weight: 600; }
  .label { font-size: 13px; fill: #9198a1; }
  .small { font-size: 11px; fill: #9198a1; }
  .hero { font-size: 44px; font-weight: 600; }
  .big { font-size: 28px; font-weight: 600; }
  .value { font-size: 13px; font-weight: 600; }
  /* Elements are visible by default; without CSS animations the final
     state is shown. */
  .fade { animation: fade .6s ease-out both; }
  .grow { transform-box: fill-box; transform-origin: bottom;
          animation: grow .7s cubic-bezier(.2,.8,.2,1) both; }
  .slide { transform-box: fill-box; transform-origin: left;
           animation: slide .9s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes fade { from { opacity: 0; } }
  @keyframes grow { from { transform: scaleY(0); } }
  @keyframes slide { from { transform: scaleX(0); } }
  @media (prefers-reduced-motion: reduce) {
    .fade, .grow, .slide { animation: none; }
  }
</style>

<rect x="0.5" y="0.5" width="839" height="175" rx="12" fill="#0d1117" stroke="#30363d"/>
<text class="title" x="24" y="36">GitHub activity</text>
<g class="fade"><text class="hero" x="160" y="104" text-anchor="middle">1,073</text>
<text class="value" x="160" y="132" text-anchor="middle">All-time contributions</text>
<text class="small" x="160" y="150" text-anchor="middle">2021 – present</text></g>
<line x1="320" y1="66" x2="320" y2="150" stroke="#30363d"/>
<g class="fade" style="animation-delay:150ms">
<text class="big" x="403" y="100" text-anchor="middle">813</text>
<text class="value" x="403" y="128" text-anchor="middle">contributions</text>
<text class="small" x="403" y="146" text-anchor="middle">in the last year</text></g>
<g class="fade" style="animation-delay:270ms">
<text class="big" x="568" y="100" text-anchor="middle">1</text>
<text class="value" x="568" y="128" text-anchor="middle">pull requests</text>
<text class="small" x="568" y="146" text-anchor="middle">merged</text></g>
<g class="fade" style="animation-delay:390ms">
<text class="big" x="733" y="100" text-anchor="middle">5</text>
<text class="value" x="733" y="128" text-anchor="middle">years</text>
<text class="small" x="733" y="146" text-anchor="middle">on GitHub since 2021</text></g>
</svg>
